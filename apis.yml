  detail: >-
    Seed Health is a direct-to-consumer microbiome supplements brand that ships
    software only as its own storefront: there is no developer.seed.com (DNS does not
    resolve), no API reference anywhere on seed.com or help.seed.com, and its one
    first-party API host, api.seed.com, is the storefront backend that seed.com/robots.txt
    explicitly closes to crawlers with "Disallow: /api/*"; its only public npm package
    is a Figma design-token library, and its Practitioner Program integrates through
    Fullscript and email rather than any programmatic surface.
