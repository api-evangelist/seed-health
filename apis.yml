aid: seed-health
name: Seed Health
description: 'Seed Health is a microbiome science company founded in 2017 by Ara Katz
  and Raja Dhir, headquartered in Los Angeles County, California. It develops and
  sells clinically studied probiotic, prebiotic and synbiotic consumer products —
  most notably the DS-01 Daily Synbiotic, the PDS-08 Pediatric Daily Synbiotic and
  the VS-01 Vaginal Synbiotic — direct to consumers via a subscription commerce site
  at seed.com, alongside SeedLabs, its environmental and applied-microbiology research
  arm. Seed publishes a substantial public science, editorial (Cultured) and help-center
  surface, and maintains a small public GitHub organization, but it operates no public
  developer program: there is no developer portal, no published API reference, no
  OpenAPI, GraphQL, AsyncAPI or MCP contract, and its internal storefront API paths
  are explicitly disallowed in robots.txt. Its practitioner program is fulfilled through
  Fullscript and email rather than through any integration surface.'
