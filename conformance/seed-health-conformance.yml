generated: '2026-08-26'
method: searched
source: >-
  https://seed.com/robots.txt (HTTP 200), https://help.seed.com/llms.txt (HTTP 200),
  https://seed.com/terms-conditions (last updated 2025-12-18),
  https://seed.com/privacy-policy, https://seed.com/consumer-health-data, and the
  live TLS/DNS probe recorded in security/seed-health-domain-security.yml.
note: >-
  Seed Health publishes no API contract, so every API-shaped standard below is
  recorded as not-conformant on the honest grounds that there is nothing to conform.
  The two entries that DO conform are surfaces the company genuinely publishes: a
  Content Signals declaration in robots.txt and an llms.txt on its help-centre host.
  No compliance certification (SOC 2, ISO 27001, HIPAA, PCI, FedRAMP) is published on
  any public Seed surface, so NO type Compliance pointer is emitted in apis.yml.
domain_standard:
  market: consumer dietary supplements / microbiome science
  standard_declared: null
  note: >-
    REWARD-ONLY and correctly empty. Seed's market has no machine-readable domain
    standard for a contract to declare — the applicable regimes (FDA DSHEA labelling,
    FTC substantiation, state consumer-health-data statutes such as Washington's My
    Health My Data) are regulatory obligations on a product, not interchange schemas
    an API can signal. Nothing was invented to fill this slot.
